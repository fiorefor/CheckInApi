bodyType: application/json
description: |-
  `POST /api/pasajes/{idPasajero}`

  Crea y asigna un pasaje al pasajero indicado. El servidor asigna
  automáticamente el primer asiento libre del vuelo (`1A`, `1B`, ...).

  - `tipoVuelo`: `N` (nacional, precio base 200.000) o `I` (internacional, 500.000)
  - `tipoTarifa`: `F` (+250.000), `PE` (+300.000), `B` (+350.000) o `P` (+400.000)
  - `nroVuelo`: obligatorio

  Devuelve `201 Created` con el pasaje, `404` si el pasajero no existe o
  `400` si los datos del pasaje son inválidos.
