bodyType: application/json
description: |-
  `PUT /api/Equipaje/{idPasajero}/{codigoEtiqueta}`

  Actualiza el peso y el tipo del equipaje, y recalcula `tarifaExceso`.
  El código de etiqueta viaja en la ruta y no se modifica.

  Devuelve `200` con `{ "mensaje": ... }`, `404` si el pasajero o el
  equipaje no existen, o `400` si el peso no es mayor a `0`.
