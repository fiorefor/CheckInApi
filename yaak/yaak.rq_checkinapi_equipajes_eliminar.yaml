description: |-
  `DELETE /api/Equipaje/{idPasajero}/{codigoEtiqueta}`

  Quita el equipaje de la lista del pasajero y reescribe `Data/pasajeros.txt`.
  Devuelve `200` con `{ "mensaje": ... }`, o `404` si el pasajero o el
  equipaje no existen.
