bodyType: application/json
description: |-
  `POST /api/Equipaje/{idPasajero}`

  Registra un equipaje para el pasajero y devuelve `201 Created` con la
  `tarifaExceso` calculada. Un equipaje de `20 kg` en un vuelo nacional
  (`15 kg` permitidos) genera `$12.500` de exceso.

  Devuelve `400` si el pasajero no existe, no tiene pasaje, el peso no es
  mayor a `0`, el código está vacío o ya existe para ese pasajero.
