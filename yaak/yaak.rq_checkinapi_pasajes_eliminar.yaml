description: |-
  `DELETE /api/pasajes/{idPasajero}`

  Quita el pasaje del pasajero (el pasajero se conserva). Devuelve `200`
  con `{ "mensaje": "Pasaje eliminado correctamente." }`, o `404` si el
  pasajero no existe o no tiene pasaje.
