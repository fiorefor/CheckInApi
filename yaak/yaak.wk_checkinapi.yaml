name: CheckInApi
description: |-
  Workspace para probar la API de check-in de pasajes.

  Antes de enviar requests, arrancá la API desde la raíz del proyecto:

  ```
  dotnet run
  ```

  La API escucha en `http://localhost:5129` (perfil `http` de `launchSettings.json`).
  Ese valor está en la variable de entorno `base_url`.

  Carpetas:
  - **Pasajeros**: `/api/pasajeros` (listar, obtener, crear, actualizar, eliminar)
  - **Pasajes**: `/api/pasajes` (listar, obtener, asignar, actualizar, eliminar)
  - **Equipajes**: `/api/equipajes` (listar, obtener, registrar, actualizar, eliminar)

  Los equipajes se guardan dentro de la línea del pasajero en `Data/pasajeros.txt`:
  sobreviven al reinicio de la API y se eliminan junto con el pasajero.
