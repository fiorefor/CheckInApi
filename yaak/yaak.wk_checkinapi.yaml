name: CheckInApi
description: |-
  Workspace para probar la API de check-in de pasajes.

  Antes de enviar requests, arrancá la API desde la raíz del proyecto:

  ```
  dotnet run
  ```

  La API escucha en `http://localhost:5129` (perfil `http` de `launchSettings.json`).
  Ese valor está en la variable de entorno `base_url`.

  Carpetas:
  - **Pasajeros**: `/api/Pasajero` (listar, obtener, crear, actualizar, eliminar)
  - **Pasajes**: `/api/Pasajes` (listar, obtener, asignar, actualizar, eliminar)
