description: |-
  `GET /api/Equipaje/{idPasajero}/{codigoEtiqueta}`

  Busca un equipaje por su código de etiqueta dentro del pasajero indicado,
  sin distinguir mayúsculas. Devuelve `404` si el pasajero o el equipaje no existen.
